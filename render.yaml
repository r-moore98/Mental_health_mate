services:
  - type: web # valid values: https://render.com/docs/yaml-spec#type
    region: ohio
    name: sample-service-name
    env: python # valid values: https://render.com/docs/yaml-spec#environment
    buildCommand: "./render_build.sh"
    startCommand: "gunicorn wsgi:application --chdir backend"
    plan: free # optional; defaults to starter
    numInstances: 1
envVars:
  - key: BASENAME
    value: /

  - key: FLASK_APP
    value: src/app.py

  - key: FLASK_DEBUG
    value: 0

  - key: FLASK_APP_KEY
    value: "any key works"

  - key: PYTHON_VERSION
    value: 3.11.8
